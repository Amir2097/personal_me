<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="5" />
    <title>Сервис запускается · DAUTOVTECH</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07110d;
        --fg: #d7efe3;
        --muted: #8eab9b;
        --accent: #c8a45c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background:
          radial-gradient(circle at 20% 10%, rgba(26, 77, 58, 0.45), transparent 40%),
          radial-gradient(circle at 80% 90%, rgba(200, 164, 92, 0.12), transparent 35%),
          var(--bg);
        color: var(--fg);
      }
      .card {
        width: min(560px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 28px 24px;
        background: rgba(0, 0, 0, 0.35);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      }
      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 11px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.3;
      }
      p {
        margin: 14px 0 0;
        color: var(--muted);
        line-height: 1.55;
        font-size: 14px;
      }
      code {
        color: var(--accent);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 22px;
      }
      a, button {
        appearance: none;
        border: 1px solid rgba(200, 164, 92, 0.45);
        background: rgba(200, 164, 92, 0.12);
        color: var(--fg);
        border-radius: 10px;
        padding: 10px 14px;
        text-decoration: none;
        cursor: pointer;
        font: inherit;
      }
      .pulse {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(200, 164, 92, 0.55);
        animation: pulse 1.4s infinite;
      }
      @keyframes pulse {
        70% { box-shadow: 0 0 0 10px rgba(200, 164, 92, 0); }
        100% { box-shadow: 0 0 0 0 rgba(200, 164, 92, 0); }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow"><span class="pulse"></span>starting</p>
      <h1>Сервис ещё поднимается</h1>
      <p>
        Nginx уже работает, а <code>frontend</code> / <code>billiards</code> ставят зависимости
        и прогревают Nuxt. Обычно это 1–3 минуты после <code>docker compose up --build</code>.
      </p>
      <p>
        Страница обновится сама через 5 секунд. Когда порт будет слушать —
        откроется обычный интерфейс.
      </p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Обновить сейчас</button>
        <a href="/hobby">К /hobby</a>
        <a href="/">На хаб</a>
      </div>
    </main>
  </body>
</html>
