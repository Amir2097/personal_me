server {
    listen 80;
    server_name _;

    # Docker embedded DNS — resolve upstreams at request time so nginx
    # starts even while billiards/frontend are still installing deps.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Friendly waiting page while Nuxt containers are still booting.
    # Named location avoids re-entering the catch-all proxy on / .
    error_page 502 503 504 =200 @starting;

    location @starting {
        root /usr/share/nginx/html;
        rewrite ^ /starting.html break;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        add_header X-Service-Starting "1" always;
    }

    location = /starting.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/api/(v1/(kolkhoz|cup|academy|billiards|site)|sukno)(/|$) {
        set $sukno_upstream http://billiards-api:8010;
        proxy_pass $sukno_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 5m;
    }

    location /billiards/ {
        set $billiards_upstream http://billiards:3010;
        proxy_pass $billiards_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_connect_timeout 2s;
        proxy_intercept_errors on;
    }

    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_connect_timeout 2s;
        proxy_intercept_errors on;
    }
}
